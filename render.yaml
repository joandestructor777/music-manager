databases:
  - name: music-manager-db
    databaseName: music_db
    user: music_user
    plan: free

services:
  - type: web
    name: music-manager-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: music-manager-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
